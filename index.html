<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SME Entrepreneurship Melaka - Latest Updates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    font-family: 'Inter', sans-serif;
    background: #f5f6f8;
    color: #222;
}
/* =========================
   HEADER
========================= */
header {
    background: linear-gradient(135deg, #081729, #0f2540);
    color: white;
    padding: 45px 20px;
    text-align: center;
}
header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 38px;
    margin-bottom: 10px;
}
header p {
    max-width: 700px;
    line-height: 1.7;
    color: #d9e2ef;
    margin: 0 auto;
}
/* =========================
   MAIN
========================= */
main {
    max-width: 650px;
    margin: 40px auto;
    padding: 0 20px;
}
/* =========================
   TITLE
========================= */
.feed-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    margin-bottom: 25px;
    text-align: center;
    position: relative;
}
.feed-title::after {
    content: "";
    width: 80px;
    height: 3px;
    background: #d62828;
    display: block;
    margin: 10px auto 0;
}
/* =========================
   FACEBOOK FEED
========================= */
.facebook-feed-wrapper {
    max-width: 600px;
    margin: 0 auto;
}
/* =========================
   FOOTER
========================= */
footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    padding: 30px;
}
/* =========================
   MOBILE
========================= */
@media (max-width: 650px) {
    header {
        padding: 35px 20px;
    }
    header h1 {
        font-size: 30px;
    }
    header p {
        font-size: 14px;
    }
    main {
        margin: 30px auto;
        padding: 0 12px;
    }
    .feed-title {
        font-size: 24px;
    }
}
</style>
</head>
<body>
<!-- =========================
     HEADER
========================= -->
<header>
    <h1>SME Entrepreneurship Melaka</h1>
    <p>
        Stay updated with the latest news, events, workshops and announcements from
        SME Entrepreneurship Melaka through our official Facebook page.
    </p>
</header>
<!-- =========================
     MAIN CONTENT
========================= -->
<main>
    <h2 class="feed-title">
        Latest Updates
    </h2>
    <!-- SociableKit Facebook Feed -->
    <div class="facebook-feed-wrapper">
        <div class="sk-ww-facebook-page-posts" data-embed-id="25703915"></div>
        <script src="https://widgets.sociablekit.com/facebook-page-posts/widget.js" defer></script>
    </div>
</main>
<!-- =========================
     FOOTER
========================= -->
<footer>
    © SME Entrepreneurship Melaka
</footer>
</body>
</html>
