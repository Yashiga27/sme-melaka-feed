<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SME Entrepreneurship Melaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:'Inter',sans-serif;
    background:#f4f6f9;
    color:#222;
    text-align:center;
}
header{
    background:#0f2540;
    color:white;
    padding:40px 20px;
    text-align:center;
}
header h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:36px;
}
header p{
    margin-top:10px;
    opacity:.9;
}
.container{
    max-width:1400px;
    margin:40px auto;
    display:grid;
    grid-template-columns:
    280px
    1fr
    280px;
    gap:25px;
    padding:0 20px;
    justify-items:center;
}
.card{
    background:white;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    overflow:hidden;
    width:100%;
    text-align:center;
}
.card h3{
    padding:15px;
    border-bottom:1px solid #eee;
    font-size:18px;
    text-align:center;
}
.card img{
    width:100%;
    display:block;
}
.card .content{
    padding:15px;
    text-align:center;
}

/* --- Facebook feed crop: hides the top Follow/Share bar --- */
.feed .fb-feed-wrapper{
    position:relative;
    width:100%;
    height:1150px;
    overflow:hidden;
}
.feed .fb-feed-wrapper iframe{
    position:absolute;
    top:-185px;              /* pulls the page header (name/Follow/Share) out of view */
    left:0;
    width:100%;
    height:1485px;           /* original 1300px + the 185px we shifted up */
    border:none;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}
@media(max-width:1000px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>
<header>
<h1>SME Entrepreneurship Melaka</h1>
<p>
Latest news, events and Facebook updates.
</p>
</header>
<div class="container">
<!-- LEFT -->
<div class="card">
<h3>Upcoming Event</h3>
<img src="promotion.jpg">
<div class="content">
<p>
Platinum Business Awards 2026
</p>
</div>
</div>
<!-- MIDDLE -->
<div class="card feed">
<h3>Latest Updates</h3>
<div class="fb-feed-wrapper">
<iframe
src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Fp%2FSME-Entrepreneurship-Melaka-61584066234675%2F&tabs=timeline&width=700&height=1300&small_header=true&hide_cover=true&show_facepile=false&adapt_container_width=true">
</iframe>
</div>
</div>
<!-- RIGHT -->
<div class="card">
<h3>Advertisement</h3>
<img src="advertisement.jpg">
<div class="content">
<p>
Promote your business with SME Entrepreneurship Melaka.
</p>
</div>
</div>
</div>
<footer>
© SME Entrepreneurship Melaka
</footer>
</body>
</html>
