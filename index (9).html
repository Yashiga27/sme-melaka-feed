<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SME Entrepreneurship Melaka - Latest Updates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Inter',sans-serif;
    background:#f5f6f8;
    color:#222;
}
header{
    background:linear-gradient(135deg,#081729,#0f2540);
    color:white;
    padding:45px 20px;
    text-align:center;
}
header h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:38px;
    margin-bottom:10px;
}
header p{
    max-width:700px;
    line-height:1.7;
    color:#d9e2ef;
    margin:0 auto;
}
main{
    max-width:600px;
    margin:40px auto;
    padding:0 20px;
    text-align:center;
}
.feed-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:28px;
    margin-bottom:25px;
    position:relative;
}
.feed-title::after{
    content:"";
    width:80px;
    height:3px;
    background:#d62828;
    display:block;
    margin:10px auto 0;
}
#feed-container{
    text-align:left;
}
.fb-post-card{
    background:white;
    border:1px solid #e6e6e6;
    border-radius:8px;
    margin-bottom:25px;
    overflow:hidden;
}
.fb-post-card .thumb{
    width:100%;
    display:block;
    aspect-ratio:1/1;
    object-fit:cover;
    background:#e9edf2;
}
.fb-post-body{
    padding:16px 18px 8px;
}
.fb-post-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
}
.fb-post-header img{
    width:36px;
    height:36px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}
.fb-post-header .name{
    font-weight:700;
    font-size:15px;
    color:#0f2540;
}
.fb-post-header .time{
    font-size:12.5px;
    color:#8a8f98;
    font-style:italic;
}
.fb-post-desc{
    font-size:14.5px;
    line-height:1.55;
    color:#333;
}
.fb-post-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    padding:14px 18px;
    border-top:1px solid #eee;
    margin-top:12px;
}
.fb-post-footer a{
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    padding:8px 16px;
    border-radius:6px;
    background:#eef0f3;
    color:#0f2540;
    transition:background .2s;
}
.fb-post-footer a:hover{
    background:#dfe3e8;
}
.loading-text{
    color:#999;
    font-size:14px;
    text-align:center;
    padding:20px;
}
footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:30px;
}
</style>
</head>
<body>
<header>
    <h1>SME Entrepreneurship Melaka</h1>
    <p>
        Stay updated with the latest news, events, workshops and announcements from
        SME Entrepreneurship Melaka through our official Facebook page.
    </p>
</header>
<main>
    <h2 class="feed-title">Latest Updates</h2>
    <div id="feed-container">
        <p class="loading-text">Loading latest posts...</p>
    </div>
</main>
<footer>
    © SME Entrepreneurship Melaka
</footer>

<script>
// Loads posts.json (generated by fetch-posts.js) and renders them
// as static cards -- no iframe, no live Facebook loading spinner.
fetch('posts.json')
    .then(res => res.json())
    .then(posts => {
        const container = document.getElementById('feed-container');
        container.innerHTML = '';

        if (!posts.length) {
            container.innerHTML = '<p class="loading-text">No posts found.</p>';
            return;
        }

        posts.forEach(post => {
            const timeAgo = new Date(post.time).toLocaleDateString('en-GB', {
                day: 'numeric', month: 'short', year: 'numeric'
            });

            const card = document.createElement('div');
            card.className = 'fb-post-card';
            card.innerHTML = `
                ${post.image ? `<img class="thumb" src="${post.image}" alt="Post image">` : ''}
                <div class="fb-post-body">
                    <div class="fb-post-header">
                        <img src="page-avatar.jpg" alt="SME Entrepreneurship Melaka">
                        <div>
                            <div class="name">SME Entrepreneurship Melaka</div>
                            <div class="time">${timeAgo}</div>
                        </div>
                    </div>
                    <p class="fb-post-desc">${post.message}</p>
                </div>
                <div class="fb-post-footer">
                    <a href="${post.link}" target="_blank" rel="noopener">View on Facebook</a>
                    <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(post.link)}" target="_blank" rel="noopener">Share</a>
                </div>
            `;
            container.appendChild(card);
        });
    })
    .catch(err => {
        document.getElementById('feed-container').innerHTML =
            '<p class="loading-text">Could not load posts.json yet — make sure fetch-posts.js has been run and posts.json is uploaded next to this HTML file.</p>';
        console.error(err);
    });
</script>
</body>
</html>
